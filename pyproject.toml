[project]
name = "pascal-string-escape-decoder"
version = "0.1.0"
description = "Decodes Pascal and Delphi string literals containing hex (#xFF), unicode (#1234), and named escape sequences into Python strings."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
